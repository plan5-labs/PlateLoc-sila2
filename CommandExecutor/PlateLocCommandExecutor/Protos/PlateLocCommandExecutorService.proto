syntax = "proto3";

option csharp_namespace = "PlateLocCommandExecutor";

service PlateLocCommandExecutorService {
	rpc StartCycle(StartCycleRequest) returns (StartCycleResponse);
	rpc StopCycle(StopCycleRequest) returns (StopCycleResponse);
	rpc Abort(AbortRequest) returns (AbortResponse);
	rpc SetSealingTime(SetSealingTimeRequest) returns (SetSealingTimeResponse);
	rpc SetSealingTemperature(SetSealingTemperatureRequest) returns (SetSealingTemperatureResponse);
	rpc EnumerateProfiles(EnumerateProfilesRequest) returns (EnumerateProfilesResponse);
	rpc GetSealingTime(GetSealingTimeRequest) returns (GetSealingTimeResponse);
	rpc GetSealingTemperature(GetSealingTemperatureRequest) returns (GetSealingTemperatureResponse);
	rpc GetActualTemperature(GetActualTemperatureRequest) returns (GetActualTemperatureResponse);
	rpc GetCycleCount(GetCycleCountRequest) returns (GetCycleCountResponse);
	rpc GetFirmwareVersion(GetFirmwareVersionRequest) returns (GetFirmwareVersionResponse);
	rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
	rpc SubscribeStatus(SubscribeStatusRequest) returns (stream SubscribeStatusResponse);
}

message StartCycleRequest {}
message StartCycleResponse {}

message StopCycleRequest {}
message StopCycleResponse {}

message AbortRequest {}
message AbortResponse {}

message SetSealingTimeRequest {
	double sealingTime = 1;
}
message SetSealingTimeResponse {}

message SetSealingTemperatureRequest {
	int32 sealingTemperature = 1;
}
message SetSealingTemperatureResponse {}

message EnumerateProfilesRequest {}
message EnumerateProfilesResponse {
	repeated string profileNames = 1;
}

message GetSealingTimeRequest {}
message GetSealingTimeResponse {
	double sealingTime = 1;
}

message GetSealingTemperatureRequest {}
message GetSealingTemperatureResponse {
	int32 sealingTemperature = 1;
}


message GetActualTemperatureRequest {}
message GetActualTemperatureResponse {
	int32 actualTemperature = 1;
}

message GetCycleCountRequest {}
message GetCycleCountResponse {
	int32 cycleCount = 1;
}

message GetFirmwareVersionRequest {}
message GetFirmwareVersionResponse {
	string firmwareVersion = 1;
}

message GetVersionRequest {}
message GetVersionResponse {
	string version = 1;
}


message SubscribeStatusRequest {}
message SubscribeStatusResponse {
	int32 status = 1;
}